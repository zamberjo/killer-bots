# El simulador sin instalar Node: `./bots.sh [--linked] <orden>` (ver README).
#
# Este fichero vale para cualquier Supabase: la URL y las claves llegan por
# entorno, y las pone bots.sh. Para el Supabase local, bots.sh añade además
# compose.local.yaml, que une el contenedor a la red de `supabase start`.

x-bots: &bots
  build: .
  image: killer-bots
  environment:
    SUPABASE_URL: ${SUPABASE_URL:?ejecuta con ./bots.sh}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?ejecuta con ./bots.sh}
    SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?ejecuta con ./bots.sh}
    # Sin valor por defecto a propósito: contra un proyecto de verdad, una
    # contraseña de bot conocida es una cuenta abierta. bots.sh la pone.
    BOTS_SECRET: ${BOTS_SECRET:?ejecuta con ./bots.sh}
    BOTS_POOL_SIZE: ${BOTS_POOL_SIZE:-30}
    BOTS_POLL_MS: ${BOTS_POLL_MS:-15000}
    BOTS_TICK_MS: ${BOTS_TICK_MS:-20000}
    BOTS_TIMEZONE: ${BOTS_TIMEZONE:-Europe/Madrid}
    # Vacías = sin forzar: la hora real y el mapa de OpenStreetMap.
    BOTS_FORCE_HOUR: ${BOTS_FORCE_HOUR:-}
    BOTS_MAP_FILE: ${BOTS_MAP_FILE:-}
    BOTS_OVERPASS_URL: ${BOTS_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
  # El código se monta: un cambio en src/ o test/ no obliga a reconstruir.
  volumes:
    - ./src:/app/src:ro
    - ./test:/app/test:ro
    - ./scripts:/app/scripts:ro

services:
  # `./bots.sh up`: los bots conectados, hasta que se paren.
  bots:
    <<: *bots
    command: ["npm", "start"]
    restart: unless-stopped

  # Órdenes sueltas: `./bots.sh pool | test | check`.
  tools:
    <<: *bots
    profiles: [tools]
    command: ["npm", "run", "pool"]
